# Producción en el KVM 4: /opt/apps/msc-web (docs/web-publica.md, apartado 8).
# Bloque 270 reservado: la web escucha solo en 127.0.0.1:3270; el nginx del host pone dominio y TLS.
name: msc-web
services:
  web:
    build:
      context: ../../..
      dockerfile: apps/site/Dockerfile
    image: msc-site:latest
    container_name: msc-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3270:80'
    labels:
      jrgb.project: msc-web
      jrgb.offset: '270'
      jrgb.domain: misagradocorazon.com
