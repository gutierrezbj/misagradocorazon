# vhost del nginx del servidor (KVM 1): /etc/nginx/sites-available/misagradocorazon.com
# Después: ln -s a sites-enabled, nginx -t && systemctl reload nginx, y certbot --nginx (redirigir a HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name misagradocorazon.com www.misagradocorazon.com;

    location / {
        proxy_pass http://127.0.0.1:3270;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
