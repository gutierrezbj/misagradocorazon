name: Imágenes de staging

# Beta en el KVM 1 (deploy/staging): en el servidor no se construye nada, solo se descargan las
# imágenes. Aquí se construyen y se suben a GHCR, etiquetadas con el SHA completo del commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-images
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/gutierrezbj
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API y worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-api:staging
            ${{ env.REGISTRY }}/misagradocorazon-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Panel (apunta a la API de staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api-staging.misagradocorazon.com
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-admin:staging
            ${{ env.REGISTRY }}/misagradocorazon-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - name: Beta web (apunta a la API de staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mobile/Dockerfile.web
          push: true
          build-args: |
            EXPO_PUBLIC_BACKEND_URL=https://api-staging.misagradocorazon.com
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-web:staging
            ${{ env.REGISTRY }}/misagradocorazon-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Web pública (misagradocorazon.com)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-site:staging
            ${{ env.REGISTRY }}/misagradocorazon-site:${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
      - name: Copias de seguridad
        uses: docker/build-push-action@v6
        with:
          context: deploy/staging/backup
          push: true
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-backup:staging
            ${{ env.REGISTRY }}/misagradocorazon-backup:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
