name: Imágenes de staging

# Staging provisional en el VPS (deploy/staging): el servidor tiene 1 CPU y comparte máquina con
# otros proyectos, así que no compila. Aquí se construyen las imágenes y se suben a GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-images
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/gutierrezbj
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API y worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-api:staging
            ${{ env.REGISTRY }}/misagradocorazon-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Panel (apunta a la API de staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api-staging.misagradocorazon.com
          tags: |
            ${{ env.REGISTRY }}/misagradocorazon-admin:staging
            ${{ env.REGISTRY }}/misagradocorazon-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
