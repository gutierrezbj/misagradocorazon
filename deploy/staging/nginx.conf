# Staging de Mi Sagrado Corazón en el nginx del VPS.
# Copiar a /etc/nginx/sites-available/misagradocorazon-staging, enlazar en sites-enabled y, con los DNS ya
# apuntando al VPS: sudo certbot --nginx -d api-staging.misagradocorazon.com -d admin-staging.misagradocorazon.com
# Certbot añade el bloque 443 y la redirección de HTTP a HTTPS.

# API y chat de misa (Socket.IO).
server {
    listen 80;
    server_name api-staging.misagradocorazon.com;

    # La API limita el JSON a 100 kB; las subidas de medios van directas a R2.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La API confía en un salto de proxy (trust proxy = 1) y toma la IP real de aquí.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket del chat de misa: conexiones largas.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Panel de gestión.
server {
    listen 80;
    server_name admin-staging.misagradocorazon.com;

    location / {
        proxy_pass http://127.0.0.1:3270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
