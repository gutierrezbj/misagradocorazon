# Beta de Mi Sagrado Corazón en el nginx del KVM 1.
# Se instala como /etc/nginx/sites-available/msc, se enlaza en sites-enabled y, con los DNS ya
# apuntando al KVM 1:
#   certbot --nginx --non-interactive --redirect \
#     --account <cuenta ACME de producción del KVM 1 que elija JuanCho, anotada en el Cuaderno> \
#     -d api-staging.misagradocorazon.com -d admin-staging.misagradocorazon.com -d app.misagradocorazon.com
# En el KVM 1 hay dos cuentas ACME de producción: sin --account, certbot se para a preguntar.
# Certbot añade el bloque 443 y la redirección de HTTP a HTTPS.
#
# msc-cerrado: la primera línea de cada server incluye /etc/nginx/snippets/msc-cerrado*.conf. Con
# ese fichero en el servidor, la beta solo se ve desde casa del fundador hasta la apertura; sin él,
# el comodín no carga nada. El fichero no va en el repositorio.
#
# X-Forwarded-For lleva un solo valor, la IP que ve nginx: la API confía en un salto
# (trust proxy = 1) y pasa esa IP a Better Auth (docs/seguridad.md, "IP real del cliente").
# No cambiar sin revisar trust proxy.

# API y chat de misa (Socket.IO).
server {
    include /etc/nginx/snippets/msc-cerrado*.conf;
    listen 80;
    server_name api-staging.misagradocorazon.com;

    # La API limita el JSON a 100 kB; las subidas de medios van directas a R2.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket del chat de misa: conexiones largas.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Panel de gestión.
server {
    include /etc/nginx/snippets/msc-cerrado*.conf;
    listen 80;
    server_name admin-staging.misagradocorazon.com;

    location / {
        proxy_pass http://127.0.0.1:3271;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Beta web instalable (SDD-05 US-27).
server {
    include /etc/nginx/snippets/msc-cerrado*.conf;
    listen 80;
    server_name app.misagradocorazon.com;

    location / {
        proxy_pass http://127.0.0.1:5270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
